# action key
unbind C-b
set-option -g prefix C-f
bind C-f send-prefix
set-option -g repeat-time 0
set-option -g focus-events on
set-option -g status-position top
set-option -g allow-passthrough on


# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',xterm-256color:RGB'


#### Key bindings

set-window-option -g mode-keys vi

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
# Open current directory
bind o run-shell "open #{pane_current_path}"
bind -r e kill-pane -a

# Prefix pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Remove Ctrl-h/j/k/l pane navigation from vim-tmux-navigator and old resize bindings.
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind C-h
unbind C-j
unbind C-k
unbind C-l
unbind -T copy-mode-vi C-h
unbind -T copy-mode-vi C-j
unbind -T copy-mode-vi C-k
unbind -T copy-mode-vi C-l

# Splitting window
bind -n C-n split-window -h
bind -n C-\; split-window -v -l 20

# kill pane
bind -r C-x kill-pane

# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Run Claude Code in a separate session
unbind a
bind -r b run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'
unbind D

#### basic settings

set-window-option -g mode-keys vi

# look'n feel
set-option -g history-limit 64096

# Vi copypaste mode
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
#bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse
bind-key -T copy-mode-vi y if-shell "test ! -z $KITTY_WINDOW_ID" "send-keys -X copy-pipe 'kitty +kitten clipboard'" "send-keys -X copy-pipe  'pbcopy'"

set -g allow-passthrough on
set -g set-clipboard on
set -s set-clipboard on

# New prefix bindings
set -g mouse on

# Sesh keybinds
# sesh w/ gum dir selector
bind "T" display-popup -E -w 40% "sesh connect \"$(
    sesh list -i | gum filter --no-strip-ansi --limit 1 --placeholder 'Pick session' --prompt='🛸 '
)\""

# sesh w/ (tmux fzf)
bind "K" run-shell "sesh connect \"$(
        sesh list --icons | fzf-tmux -p 90%,80% \
        --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
        --header '🔑 ^a all | ^t tmux | ^g conf | ^x zoxide | ^r rename | ^d tmux kill | ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(🛸  )+reload(sesh list --icons)' \
        --bind 'ctrl-t:change-prompt(◧  )+reload(sesh list -t --icons)' \
        --bind 'ctrl-g:change-prompt(⛯  )+reload(sesh list -c --icons)' \
        --bind 'ctrl-x:change-prompt(🗃  )+reload(sesh list -z --icons)' \
        --bind 'ctrl-f:change-prompt(🔭  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(👽  )+reload(sesh list --icons)' \
        --preview-window 'right:45%' \
        --preview 'sesh preview {}'
)\""

# tmux goodies
bind -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"
bind n next-window

# tmux display popups
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi" # yazi float
bind C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh" # quick floating terminal
bind C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit" # lazygit float
bind C-m display-popup -w 95% -h 95% -E "rmpc" # music float
bind d if-shell -F '#{m:claude-*,#{session_name}}' 'detach-client' 'display-popup -C'

# tmux plugin manager 
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'craftzdog/tmux-claude-session-manager'

set -g @sessionx-bind 'O'
set -g @resurrect-capture-pane-contents "on"

# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

run '~/.config/tmux/plugins/tpm/tpm'

# Ghostty monet.nvim palette for custom status formats
set -g @thm_terminal_bg "#00111f"
set -g @thm_bg "default"
set -g @thm_fg "#CBE0F0"
set -g @thm_red "#e07a8a"
set -g @thm_green "#8dc09a"
set -g @thm_yellow "#d4a96a"
set -g @thm_blue "#7ba8c8"
set -g @thm_active_blue "#9ac2e0"
set -g @thm_rosewater "#c2cde8"
set -g @thm_maroon "#f09aaa"
set -g @thm_overlay_0 "#2e3a50"
set -g @thm_overlay_1 "#214969"
set -g @thm_surface_0 "#2e2e42"
set -g @thm_panel "#171827"
set -g @thm_panel_alt "#1d2637"

# Configure Online status
set -g @online_icon "#[bg=#171827,fg=#CBE0F0] 󰖩 on "
set -g @offline_icon "#[bg=#171827,fg=#e07a8a,bold] 󰖪 off "

# status left look and feel
set -g status-left-length 100
set -g status-left "#[bg=#{@thm_panel},fg=#{@thm_green},bold] ▣ #S #[bg=#{@thm_panel},fg=#{@thm_overlay_0}]│#[bg=#{@thm_panel},fg=#{@thm_blue}] 󰉋 #{=/-24/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# status right look and feel
set -g status-right-length 250
set -g status-right "#[bg=#{@thm_panel},fg=#{@thm_green},bold] 󰁹 #{battery_percentage} #[bg=default] #[bg=#{@thm_panel}]#(/Users/chenyimin/.config/tmux/plugins/tmux-online-status/scripts/online_status_icon.sh)"


# Configure Tmux
set -g status-position top
set -g status-bg default
set -g status-fg "#CBE0F0"
set -g status-style "bg=default,fg=#{@thm_fg}"
set -g status-left-style "bg=default,fg=#{@thm_fg}"
set -g status-right-style "bg=default,fg=#{@thm_fg}"
set -g status-justify "absolute-centre"

# pane border look and feel
# setw -g pane-border-status top
# setw -g pane-border-format ""
# setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
# setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
# setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format "#[bg=#{@thm_panel},fg=#{@thm_rosewater}] #I: #W "
set -g window-status-style "bg=#{@thm_panel},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_panel_alt},fg=#{@thm_fg}"

set -g window-status-activity-style "bg=#{@thm_panel},fg=#{@thm_red}"
set -g window-status-bell-style "bg=#{@thm_panel},fg=#{@thm_red},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay_0}] "

set -g window-status-current-format "#[bg=#{@thm_active_blue},fg=#{@thm_terminal_bg},bold] #I: #W "
set -g window-status-current-style "bg=#{@thm_active_blue},fg=#{@thm_terminal_bg},bold"
